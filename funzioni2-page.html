  {name:'All Message',cap:'Casella condivisa',title:"Tutte le conversazioni in un'unica casella condivisa",desc:"WhatsApp ed email in un'unica cronologia per cliente, visibile a tutto il team \u2014 non sul telefono personale di un operatore. Etichette, allegati, modelli e fascicolo cliente nella stessa schermata.",steps:["WhatsApp Business viene collegato tramite un provider certificato: messaggi in entrata, ricevute di consegna e allegati arrivano direttamente sulla piattaforma.","Vedi in ogni momento dove si trova il cliente nel funnel: dove si \u00e8 fermato, quale problema ha, se serve un intervento umano."],g:'inbox'},
