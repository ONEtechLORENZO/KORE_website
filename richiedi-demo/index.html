<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#6315e8">
<title>KORE — Richiedi una demo</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Pagina "solo richiesta demo" usata mentre il sito e' nascosto dietro la pagina Coming Soon.
     Mostra il modulo "Richiedi una demo" del sito (sito.html#contatti) senza header, footer e
     pulsante WhatsApp. sito.html NON viene modificato: qui lo si carica e si nascondono le parti in piu'. -->
<style>
 html,body{margin:0;height:100%;background:#6315e8;overflow:hidden}
 #f{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .25s}
 #f.on{opacity:1}
</style>
</head>
<body>
<iframe id="f" title="Richiedi una demo KORE"></iframe>
<script>
(function(){
 /* niente animazione d'ingresso del sito: la si segna come gia' vista per questa sessione */
 try{sessionStorage.setItem('kore-intro-seen','1')}catch(e){}
 var f=document.getElementById('f');
 var CSS='header.top,.kwa,#kf,#kore-intro{display:none!important}'+
         'html,body{background:#6315e8!important}'+
         'html.theme-dark,html.theme-dark body{background:#6315e8!important}'+
         '#dm-screen .dm-mat .op-dl{display:block;margin-top:8px;font-size:11.5px;color:#fff;text-decoration:underline;text-underline-offset:3px}'+
         /* via la frase sotto il titolo ("Prenota una demo e scopri come automatizzare...") */
         '#dm-screen .dm-sub{display:none!important}';
 var PDF='/Public/One-pager%20KORE.pdf';
 var PRIVACY='https://trust.kore-hub.otech.one/informativa-privacy-sito/v1-0/';
 /* l'unica pagina ammessa: il modulo */
 var OK=['#contatti'];
 function prep(){
  var w=f.contentWindow,d;try{d=f.contentDocument}catch(e){return}
  /* solo sulla pagina vera del modulo, non sul documento vuoto iniziale dell'iframe */
  if(!d||!d.head||!/\/sito\.html/.test(d.URL)||!d.getElementById('dm-screen')||d.getElementById('solo-demo'))return;
  var s=d.createElement('style');s.id='solo-demo';s.textContent=CSS;d.head.appendChild(s);
  /* sempre viola: qui si ignora il tema scuro scelto sul sito (la preferenza salvata del sito non cambia) */
  var H=d.documentElement;function light(){if(H.classList.contains('theme-dark'))H.classList.remove('theme-dark')}
  light();new w.MutationObserver(light).observe(H,{attributes:true,attributeFilter:['class']});
  function guard(){if(OK.indexOf(w.location.hash)<0){w.location.replace('#contatti');if(w.__dmOpen)w.__dmOpen()}}
  w.addEventListener('hashchange',guard);guard();
  /* "informativa privacy" nel consenso: porta all'Informativa privacy del sito nel Trust Center (versione 1.0),
     in una nuova scheda per non perdere il modulo. Il link viene sostituito con uno nuovo, senza gli handler del sito. */
  function linkPrivacy(){[].forEach.call(d.querySelectorAll('#dm-screen .dm-cbox a:not([data-tc])'),function(a){
   var n=d.createElement('a');n.href=PRIVACY;n.target='_blank';n.rel='noopener';n.setAttribute('data-tc','1');n.textContent=a.textContent;
   a.parentNode.replaceChild(n,a)})}
  linkPrivacy();new w.MutationObserver(linkPrivacy).observe(d.getElementById('dm-screen')||d.body,{childList:true,subtree:true});
  /* materiali: via "Business case"; il One-pager si scarica subito quando lo si seleziona */
  var bc=d.querySelector('#dm-screen .dm-mat[data-mat="Business case"]');if(bc)bc.parentNode.removeChild(bc);
  var op=d.querySelector('#dm-screen .dm-mat[data-mat="One-pager KORE"]');
  if(op){
   var desc=op.querySelector('span > span');
   if(desc){var dl=d.createElement('span');dl.className='op-dl';dl.textContent='↓ Clicca per scaricare il PDF';desc.parentNode.appendChild(dl)}
   op.addEventListener('click',function(){
    if(op.getAttribute('aria-pressed')!=='true')return; /* solo quando viene selezionato, non quando lo si deseleziona */
    var a=d.createElement('a');a.href=PDF;a.download='One-pager KORE.pdf';a.style.display='none';d.body.appendChild(a);a.click();a.remove();
   });
  }
  var lg=d.querySelector('#dm-screen .dm-mats .dm-legal');if(lg)lg.textContent='Selezionalo per scaricarlo subito: te lo alleghiamo anche alla risposta.';
  setTimeout(function(){f.className='on'},60);
 }
 f.addEventListener('load',prep);
 f.src='/sito.html#contatti';
 /* il modulo compare anche se l'evento load arriva tardi (font e immagini pesanti) */
 var tries=0,t=setInterval(function(){tries++;try{if(f.contentDocument&&f.contentDocument.readyState!=='loading'){prep()}}catch(e){}
  if(f.className==='on'||tries>100)clearInterval(t)},100);
})();
</script>
</body>
</html>
